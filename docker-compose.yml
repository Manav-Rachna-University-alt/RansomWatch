version: '3.8'

services:
  ransomwatch:
    build: .
    container_name: ransomwatch-app
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - RANSOMWATCH_API_URL=http://localhost:8000
      - SIMULATION_MODE=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
